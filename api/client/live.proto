syntax = "proto3";

package nighthawk.client;

import "google/protobuf/duration.proto";

// FORK-ONLY (We-Amp): this file, and the messages it defines, are fork-specific
// additions that do not exist upstream. Rebase check: if an upstream change
// collides with the ones here, the fork's additions must give way before
// rebasing — colliding field NUMBERS are renumbered, while colliding MESSAGE
// NAMES are renamed (fork-private names carry no wire-compat obligation).
// Upstream consumers never see these messages unless they explicitly opt in.

// Opt-in marker for live snapshot streaming over ExecutionStream. The message
// carries no fields: its presence in CommandLineOptions is what enables
// streaming. When absent, the service behaves exactly as it does upstream
// (a single response per run, no snapshots).
message LiveStreamingOptions {
}

// A point-in-time percentile summary of a single statistic. Percentiles are
// raw nanosecond values. Consumers must check count: 0 means there were no
// samples yet (the percentile fields are then meaningless), and an id whose
// implementation cannot answer percentile queries reports zeros.
message StatisticSnapshot {
  // The statistic id, as it appears in the run's final output (e.g.
  // "benchmark.http_latency").
  string id = 1;
  // Number of samples observed so far.
  uint64 count = 2;
  uint64 p50_ns = 3;
  uint64 p90_ns = 4;
  uint64 p99_ns = 5;
}

// A snapshot of live benchmark progress, streamed while a run is in flight.
// Aggregated from immutable per-worker partials that each worker computes on
// its own dispatcher thread; the service-side collector never touches worker
// histograms directly. Counters and statistics are cumulative from run start.
message LiveSnapshot {
  // Wall-clock time of the snapshot, unix epoch nanoseconds.
  int64 wall_time_unix_ns = 1;
  // Monotonic clock reading at snapshot creation, nanoseconds since an
  // arbitrary epoch. Strictly increasing across the snapshots of a run.
  int64 monotonic_ns = 2;
  // The benchmark phase the snapshot belongs to (currently "main").
  string phase_id = 3;
  // FORK-ONLY (We-Amp) A2 semantics (spec 8.5): the knob epoch whose schedule
  // produced this snapshot's samples -- the CURRENT knob epoch at snapshot
  // production, first-applied wins. EMPTY before the run's first applied
  // live change; "epoch-<n>" (a plain per-run monotonic counter, its own
  // namespace, never compared with phase ids) from the bend instant of the
  // n-th applied change onward. A rolled-back update leaves the prior epoch
  // in place. Consumers split flush windows at epoch changes exactly as they
  // split them at phase changes.
  string epoch_id = 4;
  // Global counter values accumulated so far, keyed by counter name.
  map<string, uint64> counters = 5;
  // Global statistics so far. Counts are summed over the workers; percentile
  // values are the maximum over the workers (per-worker histograms cannot be
  // merged without their raw samples, so this is an approximation).
  repeated StatisticSnapshot statistics = 6;
  // FORK-ONLY (We-Amp) A2 (spec 8.5): true on exactly the one snapshot that
  // first carries a changed epoch_id (advance to a new epoch, or the demotion
  // back to the prior epoch after a rolled-back update). The flush-window
  // split marker: a window straddling a marker-bearing snapshot is split at
  // it, the way M2 taught consumers to split at phase changes.
  bool epoch_changed = 7;
}

// Internal: the immutable partial snapshot one worker computes on its own
// dispatcher thread at the stats-flush cadence. Handed to the service-side
// collector, which aggregates these into a LiveSnapshot. Never serialized on
// the wire; fork-only, and subject to change without notice.
message WorkerLiveSnapshotPartial {
  uint32 worker_id = 1;
  repeated StatisticSnapshot statistics = 2;
  map<string, uint64> counters = 3;
  // The phase id whose statistic slab this partial was computed from, stamped
  // at computation time on the worker dispatcher. A partial never mixes
  // slabs; the aggregator groups/labels by this stamp and never folds
  // statistics across different stamps.
  string phase_id = 4;
  // FORK-ONLY (We-Amp) A2 (spec 8.5): the knob epoch current on this worker
  // at computation time, stamped on its dispatcher (the same dispatcher the
  // bend applies run on, so within one worker the stamp and the bend are
  // serialized). Empty until the run's first applied change reaches this
  // worker's limiter.
  string epoch_id = 5;
}

// FORK-ONLY (We-Amp): rebase check - fork-specific. One completed phase
// boundary (spec 8.5), streamed on the ExecutionStream at the moment the
// next phase's first work is scheduled — the only emit at which the
// boundary's drain and idle gap are both final.
//
// NORMATIVE (the DQ-3 ruling, mirrored on session.proto's
// PhaseBoundaryRecord): boundary events are METADATA, never synthetic metric
// snapshots. The (wall, monotonic) pair is the join key for the TUI's
// timeline and profile-window alignment and nothing else; the idle gap sits
// INSIDE the drain-complete flag for purity accounting and is never folded
// into any percentile series.
message PhaseBoundaryEvent {
  // The phase STARTING after the boundary: the event fires at its first
  // scheduled work. Empty next_phase fields on the run's final emit carry no
  // boundary at all.
  uint32 phase_index = 1;
  string phase_id = 2;
  // The engine-emitted boundary clock pair (spec 8.5).
  int64 wall_time_unix_ns = 3;
  int64 monotonic_ns = 4;
  // The boundary that ENDED the previous phase:
  string ending_phase_id = 5;
  uint32 ending_phase_index = 6;
  // Duration of the boundary's non-destructive drain (spec 8.6: recorded,
  // never zero-silent).
  google.protobuf.Duration drain_duration = 7;
  // Last drain completion -> this phase's first scheduled work (spec 8.6).
  google.protobuf.Duration idle_gap = 8;
  // The ending phase's active workers (the 8.4 non-comparability key).
  uint32 worker_count = 9;
  // True iff the transition INTO phase_id cold-started workers — the
  // successor-attributed flag (see PhaseBoundaryRecord.new_workers_cold_started
  // in api/client/session.proto for the explicit attribution rule).
  bool next_phase_cold_started = 10;
  // 8.6 counted-not-hidden: the boundary's drain was censored (the bounded
  // wait gave up at the deadline; drain_duration carries the full budget and
  // idle_gap is measured from the censoring deadline — an honest lower
  // bound).
  bool drain_censored = 11;
}
